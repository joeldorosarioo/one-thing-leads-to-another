name: Draft release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (manifest.version !== tag || pkg.version !== tag) throw new Error('The tag must match manifest.json and package.json versions.');
          if (!manifest.author || manifest.author === 'REPLACE_WITH_YOUR_NAME') throw new Error('Set the real author in manifest.json before publishing.');
          NODE
      - name: Validate build and regression tests
        run: pnpm run check
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "Note Template Sync $GITHUB_REF_NAME" \
            --generate-notes --draft
